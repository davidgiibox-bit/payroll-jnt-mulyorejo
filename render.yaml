databases:
  - name: payroll-jnt-db
    databaseName: payroll_jnt
    user: payroll_jnt
    plan: free

services:
  - type: web
    name: payroll-jnt-mulyorejo
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade && flask seed-menu"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: payroll-jnt-db
          property: connectionString
      - key: GOOGLE_SHEETS_CREDENTIALS_JSON_CONTENT
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
